# Single public entry point (port 80). All app services listen on 127.0.0.1 only.
#   /           -> Next.js frontend      (3000)
#   /backend/   -> Express API           (5000)
#   /agents/    -> FastAPI agents        (8000)
#   /lab/       -> lab-backend (kernel)  (8010)
#   /lab-agent/ -> lab-agent             (8020)
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;   # dataset uploads

    # Shared proxy settings. Buffering is off so streamed (SSE) agent output is not held back.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_buffering    off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location /backend/   { proxy_pass http://127.0.0.1:5000/; }
    location /agents/    { proxy_pass http://127.0.0.1:8000/; }
    location /lab/       { proxy_pass http://127.0.0.1:8010/; }
    location /lab-agent/ { proxy_pass http://127.0.0.1:8020/; }
    location /           { proxy_pass http://127.0.0.1:3000;   }
}
